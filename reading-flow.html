<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ===== BASIC META ===== -->
  <meta charset="UTF-8">
  <title>Readify | Reading Flow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ===== FONTS & ICON ===== -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="image/icon.png">

  <!-- ===== STYLES ===== -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="reading-flow.css">
</head>

<body>

<!-- ===== HEADER / NAVBAR ===== -->
<header class="site-header">
  <nav class="nav">
    <div class="logo">Readify</div>

    <!-- Mobile hamburger -->
    <button class="nav-toggle" aria-label="Toggle navigation">
      <span class="nav-line"></span>
      <span class="nav-line"></span>
      <span class="nav-line"></span>
    </button>

    <!-- Navigation links -->
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="book-explorer.html">Books</a></li>
      <li><a href="progress.html">Tracker</a></li>
      <li><a href="recommender.html">Recommender</a></li>
      <li><a href="reading-flow.html" class="active">Reading Flow</a></li>
      <li><a href="feedback.html">Feedback</a></li>
    </ul>
  </nav>
</header>

<!-- ===== PAGE BANNER ===== -->
<section class="flow-banner">
  <h1>Reading Flow</h1>
  <p>Create a calm reading atmosphere.</p>
</section>

<!-- ===== MAIN CONTENT ===== -->
<main class="flow-page">
  <div class="flow-box">

    <!-- ===== COZY SOUNDS ===== -->
    <h2>Cozy Sounds</h2>

    <button id="playSound" class="btn-primary">
      Play Sound
    </button>

    <button id="pauseSound" class="btn-primary">
      Pause Sound
    </button>

    <!-- ===== BOOK SELECTION ===== -->
    <h2>Choose a Book</h2>

    <!-- Accessible label (hidden visually, keeps page looking the same) -->
    <label for="bookSelect" class="visually-hidden">Select a book</label>

    <select id="bookSelect">
      <option value="">Select a book</option>
      <option value="bridgerton">Bridgerton: The Duke and I</option>
      <option value="oxford-dictionary">Oxford English Dictionary</option>
      <option value="not-hoarder">You're Not a Hoarder</option>
      <option value="shadow-wind">The Shadow of the Wind</option>
      <option value="hobbit">The Hobbit</option>
      <option value="norwegian-wood">Norwegian Wood</option>
      <option value="notebook">The Notebook</option>
      <option value="hound-baskervilles">The Hound of the Baskervilles</option>
      <option value="old-man-sea">The Old Man and the Sea</option>
    </select>

    <!-- Dynamic book content -->
    <div id="bookContent" class="book-content"></div>

    <!-- ===== COMPLETED BOOKS ===== -->
    <h2>Completed Books</h2>

    <!-- Hidden label (keeps same visual design) -->
    <label for="bookInput" class="visually-hidden">Book name</label>

    <input
      type="text"
      id="bookInput"
      placeholder="Enter book name"
    >

    <button id="addBook" class="btn-primary">
      Mark as Completed
    </button>

    <!-- List populated by JS -->
    <ul id="completedList"></ul>

  </div>
</main>

  <!-- ================= FOOTER ================= -->
  <footer class="site-footer">
    <div class="footer-left">
      <h3>Readify</h3>
      <p>Simple, calm book recommendations and reading tools.</p>
      <p>Negombo, Sri Lanka</p>
    </div>

    <div class="footer-right">
      <h4>Connect with Readify</h4>

      <form class="newsletter-form">
        <label for="newsletter-email">Email</label>
        <input id="newsletter-email" type="email" placeholder="you@example.com" required>

        <div class="newsletter-checkbox">
          <input id="newsletter-consent" type="checkbox">
          <label for="newsletter-consent">Yes, subscribe me to your newsletter.</label>
        </div>

        <button type="submit" class="btn-primary">Submit</button>
      </form>
    </div>
  </footer>

<!-- ===== JAVASCRIPT ===== -->
<script src="script.js"></script>
<script src="reading-flow.js"></script>

</body>
</html>
